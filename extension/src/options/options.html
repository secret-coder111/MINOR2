<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>PhishGuard Options</title>
  </head>
  <body>
    <h1>PhishGuard options</h1>
    <label>
      <input type="checkbox" id="domainAgeEnabled" />
      Enable optional domain age enrichment
    </label>
    <br /><br />
    <label>
      <input type="checkbox" id="reputationEnabled" />
      Enable optional hostname reputation lookup
    </label>
    <br />
    <label>
      Reputation endpoint:
      <input type="url" id="reputationEndpoint" placeholder="https://your-service.example/check" size="42" />
    </label>
    <p>Only the hostname is sent. The endpoint should return JSON such as {"verdict":"malicious","source":"provider"}.</p>
    <br /><br />
    <label>
      Warning threshold:
      <input type="range" id="warningThreshold" min="20" max="90" value="65" />
      <span id="thresholdValue">65</span>
    </label>
    <br /><br />
    <button id="clearData">Clear local data</button>

    <script src="options.js"></script>
  </body>
</html>
